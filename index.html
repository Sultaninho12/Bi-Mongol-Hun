$('quiz').onclick=function(e){var t=e.target,m=t.getAttribute&&t.getAttribute('data-m');if(m)qStart(+m);var o=t.getAttribute&&t.getAttribute('data-o');if(o!=null)qAns(+o)};
function qStart(m){var p=pool($('cat1').value),h=[],i,ord=[];if(p.length<4){alert('Zu wenige Wörter');return}
for(i=0;i<p.length;i++)h.push({w:p[i],s:Math.random()-(S.bad[p[i].id]||0)*.4+(S.ok[p[i].id]||0)*.15});
h.sort(function(x,y){return x.s-y.s});for(i=0;i<h.length;i++)ord.push(h[i].w);
if(m==4){ord=[];for(i=0;i<p.length;i++)if(S.bad[p[i].id]>0)ord.push(p[i]);if(!ord.length){toast('Noch keine schwierigen Wörter – spiel erst eine Runde!');return}ord=shuf(ord)}
Q={on:true,m:m==4?1:m,n:0,ok:0,sc:0,st:0,lv:3,p:p,set:ord.slice(0,m==3?ord.length:10)};qNext()}
function qNext(){clearInterval(tm);Q.lock=0;if(Q.n>=Q.set.length||(Q.m==3&&Q.lv<=0)){Q.on=false;S.rounds++;save();$('quiz').innerHTML='<div class="card c"><div style="font-size:48px">'+(Q.ok>=8||Q.m==3&&Q.ok>=10?'🏆':Q.ok>=5?'👍':'💪')+'</div><div class="big">'+Q.ok+' richtig</div><div class="big" style="color:#ff9f1c">+'+Q.sc+' Punkte</div></div><button class="btn" id="ag">Nochmal</button>';$('ag').onclick=qMenu;return}
var w=Q.set[Q.n],dir=Math.random()<.5?1:2,o=[w],seen={},k=shuf(Q.p),c,i;seen[dir==1?w.m:w.d]=1;
for(i=0;i<k.length&&o.length<4;i++){c=dir==1?k[i].m:k[i].d;if(!seen[c]){seen[c]=1;o.push(k[i])}}
Q.w=w;Q.o=shuf(o);var hs='';if(Q.m==3)for(i=0;i<3;i++)hs+=i<Q.lv?'❤️':'🖤';
var h='<div class="c">'+(Q.m==3?hs+' · ':'Frage '+(Q.n+1)+'/'+Q.set.length+' · ')+'🔥 '+Q.st+' · ⭐ '+Q.sc+'</div>'+(Q.m==2?'<div class="bar"><i id="tb" style="width:100%;background:#ff9f1c"></i></div>':'')+'<div class="card c"><div class="big">'+(dir==1?w.i+' '+esc(w.d):esc(w.m))+'</div><div class="ph">'+(dir==1?'Was heißt das auf Mongolisch?':'Was heißt das auf Deutsch?')+'</div></div>';
for(i=0;i<Q.o.length;i++)h+='<button class="opt" data-o="'+i+'">'+esc(dir==1?Q.o[i].m:Q.o[i].d)+'</button>';
$('quiz').innerHTML=h;
if(Q.m==2){Q.t=12000;Q.t0=Date.now();tm=setInterval(function(){var r=Q.t-(Date.now()-Q.t0),b=$('tb');if(b)b.style.width=Math.max(0,r/Q.t*100)+'%';if(r<=0)qAns(-1)},100)}}
function qAns(i){if(Q.lock)return;Q.lock=1;clearInterval(tm);var w=Q.w,ok=i>=0&&Q.o[i]===w,bs=$('quiz').getElementsByClassName('opt'),j;
for(j=0;j<bs.length;j++)if(Q.o[j]===w)bs[j].className='opt ok';
if(ok){Q.st++;Q.ok++;if(S.bad[w.id]>0)S.bad[w.id]--;var g=10+Math.min(Q.st-1,5)*2;if(Q.m==2)g+=Math.ceil(Math.max(0,Q.t-(Date.now()-Q.t0))/3000);Q.sc+=g;addPts(g);if(Q.st>S.best)S.best=Q.st;if(!mark(w.id)&&(Q.st==3||Q.st==5||Q.st==10))toast('🔥 '+Q.st+'er Serie!');vib(30)}
else{if(i>=0)bs[i].className='opt no';S.bad[w.id]=(S.bad[w.id]||0)+1;Q.st=0;if(Q.m==3)Q.lv--;vib([80,40,80])}
save();Q.n++;setTimeout(qNext,ok?650:1500)}
/* Schreiben */
var cur=null,gx,cx,dr=false,guide=true,hand=false,CH=230;
function nextW(){var p=pool($('cat2').value);cur=p[Math.floor(Math.random()*p.length)];
$('wr').innerHTML='<div class="card c"><div class="de">'+cur.i+' '+esc(cur.d)+' <span class="sp" data-i="'+cur.id+'" data-l="de">🔊</span> <span class="sp" data-i="'+cur.id+'" data-l="mn">🇲🇳</span><span class="sp" data-i="'+cur.id+'" data-l="rec">'+(REC[cur.id]?'🎙️':'🎤')+'</span></div><div class="ph">'+esc(cur.p)+'</div></div><div class="cw" id="cw"><canvas id="gc"></canvas><canvas id="cv"></canvas></div><div class="row"><button class="btn l" id="cl">🧽 Löschen</button><button class="btn o" id="gd"></button><button class="btn" id="ft"></button></div><div class="row"><button class="btn g" id="ok">✔ Richtig (+5)</button><button class="btn r" id="no">✖ Nochmal</button></div><button class="btn" id="nx">Nächstes Wort ›</button>';
var cv=$('cv'),gc=$('gc'),d=window.devicePixelRatio||1,w=$('cw').clientWidth;
gc.width=cv.width=w*d;gc.height=cv.height=CH*d;gx=gc.getContext('2d');cx=cv.getContext('2d');gx.scale(d,d);cx.scale(d,d);
cx.lineWidth=5;cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle='#1e293b';cur.w=w;btn();drawGuide();
function pos(e){var t=e.touches?e.touches[0]:e,b=cv.getBoundingClientRect();return[t.clientX-b.left,t.clientY-b.top]}
function dn(e){e.preventDefault();dr=true;var p=pos(e);cx.beginPath();cx.moveTo(p[0],p[1]);cx.lineTo(p[0]+.1,p[1]);cx.stroke()}
function mv(e){if(!dr)return;e.preventDefault();var p=pos(e);cx.lineTo(p[0],p[1]);cx.stroke();cx.beginPath();cx.moveTo(p[0],p[1])}
function up(){dr=false}
cv.addEventListener('touchstart',dn,false);cv.addEventListener('touchmove',mv,false);cv.addEventListener('touchend',up,false);
cv.addEventListener('mousedown',dn,false);cv.addEventListener('mousemove',mv,false);window.addEventListener('mouseup',up,false);
$('cl').onclick=$('no').onclick=function(){cx.save();cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);cx.restore()};
$('gd').onclick=function(){guide=!guide;btn();drawGuide()};
$('ft').onclick=function(){hand=!hand;btn();drawGuide()};
$('nx').onclick=nextW;
$('ok').onclick=function(){addPts(5);mark(cur.id);save();nextW()}}
function btn(){$('gd').innerHTML=guide?'👁 Hilfe aus':'👁 Hilfe an';$('ft').innerHTML=hand?'✒️ Handschrift':'🅰️ Druckschrift'}
function drawGuide(){var w=cur.w,f=hand?'italic ':'bold ',fam=hand?'"Times New Roman",Georgia,serif':'Helvetica,Arial,sans-serif',s=84;gx.clearRect(0,0,w,CH);if(!guide)return;
gx.font=f+s+'px '+fam;while(gx.measureText(cur.m).width>w-20&&s>16){s-=4;gx.font=f+s+'px '+fam}
gx.fillStyle='rgba(43,125,233,.22)';gx.textAlign='center';gx.textBaseline='middle';gx.fillText(cur.m,w/2,CH/2)}
$('cat2').onchange=nextW;
function ymd(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function daily(){var n=new Date(),d=ymd(n);if(S.day==d)return;S.ds=(S.day==ymd(new Date(n.getTime()-864e5)))?S.ds+1:1;S.day=d;var b=Math.min(S.ds,7)*5;addPts(b);save();toast('📅 Tag '+S.ds+' in Folge! +'+b+' Punkte')}
setTimeout(daily,700);
}
/*LOADER*/
function get(u,cb){var x=new XMLHttpRequest();x.open('GET',u,true);x.onload=function(){cb(x.status<400?x.responseText:'')};x.onerror=function(){cb('')};x.send()}
var TR={а:'a',б:'b',в:'w',г:'g',д:'d',е:'je',ё:'jo',ж:'dsch',з:'s',и:'i',й:'i',к:'k',л:'l',м:'m',н:'n',о:'o',ө:'ö',п:'p',р:'r',с:'s',т:'t',у:'u',ү:'ü',ф:'f',х:'ch',ц:'z',ч:'tsch',ш:'sch',ъ:'',ы:'i',ь:'',э:'e',ю:'ju',я:'ja'};
function trans(s){var o='',i,c;s=s.toLowerCase();for(i=0;i<s.length;i++){c=s.charAt(i);o+=TR.hasOwnProperty(c)?TR[c]:c}return o.charAt(0).toUpperCase()+o.slice(1)}
function hid(s){var h=5381,i;for(i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(36)}
function trim(s){return s.replace(/^\s+|\s+$/g,'')}
function parse(L,txt){var c=[],w=[],seen={},f,k,ls,l,p,m,de,mn,ph,ci,key,cat='Allgemein';
for(f=0;f<L.length;f++){ls=(txt[L[f]]||'').split(/\r?\n/);for(k=0;k<ls.length;k++){l=trim(ls[k]);if(!l||l.indexOf('//')==0)continue;
if(l.charAt(0)=='#'){cat=trim(l.replace(/^#+/,''));continue}
p=l.split('|');if(p.length<2)continue;m=/^([^A-Za-zÄÖÜäöüß0-9„"(]*)([\s\S]*)$/.exec(trim(p[0]));
de=trim(m[2]);mn=trim(p[1]);ph=p[2]&&trim(p[2])?trim(p[2]):trans(mn);if(!de||!mn)continue;
key=hid(de+'|'+mn);if(seen[key])continue;seen[key]=1;ci=c.indexOf(cat);if(ci<0){c.push(cat);ci=c.length-1}w.push([ci,trim(m[1]),de,mn,ph])}}
return{c:c,w:w}}
get('words/index.json',function(t){var L=[];try{L=JSON.parse(t)}catch(e){}
if(!L.length){document.body.innerHTML='<p style="padding:20px">Wörter konnten nicht geladen werden. Bitte einmal mit Internet öffnen.</p>';return}
var n=L.length,txt={};L.forEach(function(f){get('words/'+f,function(x){txt[f]=x;if(--n==0){DATA=parse(L,txt);boot()}})})});
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js')['catch'](function(){})});
</script></body></html>
